<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Planets</h1>
    <h2>Earth</h2>
    <p id="earth"></p>
    <h2>Jupiter</h2>
    <p id="jupiter"></p>
    <h2>Mars</h2>
    <p id="Mars"></p>

    <script>
        document.getElementById("earth").innerHTML = "Earth is the third planet from the Sun and the only astronomical object known to harbor life."

        document.getElementById("Mars").innerHTML = "Mars is the fourth planet from the Sun and is widely known as the Red Planet due to the rusty iron oxide covering its rocky surface"

        document.getElementById("jupiter").innerHTML = "Jupiter is the fifth planet from the Sun and the largest and most massive planet in the Solar System"
    </script>
</body>
</html>
