<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <style>
       .alert{
        background-color: aqua;
        color: rgb(1, 1, 1);
        padding: 10px;
       }
    </style>
</head>
<body>
    <header>
        <h1 id="heading">Welcome</h1>
        <p>hello</p>

    </header>
    <p>Let's create a div</p>
    <script>
        let div = document.createElement("div");
        div .id = "para";
        div.className = "alert"
        div.innerHTML = "<p>Congrats! you created a div.</p>"
        document.body.append(div);

        let heading = document.getElementById("heading");
        heading.innerHTML="Welcome 😁"
        document.querySelector('header p').innerHTML="<strong>Great Work!!</strong>"
    </script>
</body>
</html>
